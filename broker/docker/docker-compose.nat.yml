# docker-compose.nat.yml — the NAT topology of docker/nat-e2e.sh (override on docker-compose.yml).
#
#   docker compose -p rune-nat-e2e -f docker/docker-compose.yml -f docker/docker-compose.nat.yml up -d rune-1 rune-2 rune-3 nat-router
#
#   nat_public   plain bridge: rune-1..3 and the router's outside leg
#   nat_private  internal bridge (no route out of it): the router's inside leg and the clients the script starts
#                with `docker run` (clients are NOT compose services)
#
# The brokers have no route to nat_private (bridge isolation), so an address a client DECLARES is unreachable from them:
# a reply reaches a client only through the NAT mapping its own traffic opened.  No address or subnet is written here;
# the script discovers every address with `docker inspect`.  The MASQUERADE rule is added by the script after `up`.

services:
  rune-1:
    networks: [nat_public]
  rune-2:
    networks: [nat_public]
  rune-3:
    networks: [nat_public]

  nat-router:
    build:
      context: .
      dockerfile: Dockerfile.nat-router
    image: rune-nat-router:${RUNE_IMAGE_TAG:-latest}
    hostname: nat-router
    networks: [nat_public, nat_private]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    command: ["sleep", "infinity"]

networks:
  nat_public: {}
  nat_private:
    internal: true
