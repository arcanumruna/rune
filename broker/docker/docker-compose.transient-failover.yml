# docker-compose.transient-failover.yml — override for docker/transient-failover-e2e.sh
# (Phase 2b E2 Task 14): the 3-node cluster of docker-compose.yml plus one STATIC
# transient topic.  topicIds follow declaration order: events=0, multi=1, cg=2,
# presence_failover=3.  Static, not runtime-defined: runtime DDL is single-node
# today (the __topic_schemas replica has no multi-node transport — the deferred
# multi-node catalog follow-on, DDL-conformance KL4).
x-transient-topics: &transient-topics
  RUNE_TOPICS: "events:1,multi:3,cg:4,presence_failover:1:persistence=transient"

services:
  rune-1:
    environment: *transient-topics
  rune-2:
    environment: *transient-topics
  rune-3:
    environment: *transient-topics
