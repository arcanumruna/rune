# docker-compose.checked-writes.yml - the 3-node key-index cluster of docker/checked-writes-e2e.sh (overlay on
# docker-compose.yml + docker-compose.auth.yml).
#
#   docker compose -p rune-checked-writes-e2e -f docker/docker-compose.yml -f docker/docker-compose.auth.yml \
#       -f docker/docker-compose.checked-writes.yml up -d rune-1 rune-2 rune-3
#
# Two knobs (docs/configuration.md): how often a verdict source's leader writes a verdict marker when nothing was rejected
# (20 ms instead of the 100 ms default keeps the markers, and so the 80,000 racing writes, quick), and how long a stopped
# producer's last batches survive compaction (60 s instead of 7 days, above the probes' 30 s timeout: on an autoincrement
# topic those batches hold the refused writes leg 8f expects compacted).

x-checked-writes-env: &checked-writes-env
  RUNE_VERDICT_INTERVAL_MS: "20"
  RUNE_PRODUCER_ID_EXPIRATION_MS: "60000"

services:
  rune-1:
    environment: *checked-writes-env
  rune-2:
    environment: *checked-writes-env
  rune-3:
    environment: *checked-writes-env
