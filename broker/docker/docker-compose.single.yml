# docker-compose.single.yml — SINGLE-NODE rune-broker (Task 13 typed e2e)
#
# One broker node that self-elects (RUNE_PEERS lists only itself), over real
# Aeron (default config), for the headline typed round-trip probe
# (docker/schema-e2e.sh + the rune-client-cpp schema-probe).
#
# WHY A SEPARATE COMPOSE (vs docker-compose.yml's 3-node cluster):
#   1. Task 13 is the SINGLE-NODE typed round-trip; one self-electing node is
#      the minimal real broker↔client Aeron path.
#   2. The 0b schema messages (DefineTopic/GetTopicSchema/…) live in the 0b
#      protocol worktree, and the broker links rune-codec (0a).  The stock
#      docker-compose.yml points the `rune-protocol` build context at
#      ../../protocol (the MAIN worktree, which lacks SchemaMessages.h)
#      and supplies NO rune-codec context.  This file wires BOTH correctly:
#        rune-protocol → ../../protocol-0b   (has SchemaMessages.h)
#        rune-codec    → ../../codec         (0a codec sibling)
#      and the Dockerfile passes -DRUNE_CODEC_ROOT=/rune-codec.
#
# Platform: linux/amd64 (Docker Desktop / Rosetta on Apple Silicon).
# Image tag: rune-broker-node:${RUNE_IMAGE_TAG:-single} — set to the commit SHA
# by the harness so layers never collide with other commits.

name: rune-broker-single

services:
  rune-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - CMAKE_BUILD_PARALLEL_LEVEL   # from the environment when set (small Docker VMs); unset = ninja default
      additional_contexts:
        # relative to this compose file's dir (docker/):
        #   ../../protocol = the sibling worktree (has SchemaMessages.h on
        #   this branch; the old "-0b" suffix was a prior epoch's naming and no
        #   longer matches the schema-evolution worktree set).
        rune-protocol: ../../protocol
        # flight-recorder flight recorder: compiled sibling lib (src/ + include/).  Not
        # part of this feature, so it is NOT worktreed under se-worktrees/ —
        # ../../flight-recorder resolves via a local symlink to the canonical checkout.
        flight-recorder: ${FLIGHT_RECORDER_DIR:-../../../flight-recorder}
        # arcanum-metrics: header-only metrics lib (include/); the Dockerfile COPYs --from=arcanum-metrics.
        arcanum-metrics: ${ARCANUM_METRICS_DIR:-../../../arcanum-metrics}
        # rune-codec (0a): compiled sibling lib (src/ + include/) linked into rune_node
        rune-codec: ../../codec
        # rune-crypto (client<->broker TLS/AEAD, Task 5/7): compiled sibling lib
        # (src/ + include/). The TLS/crypto merge from origin/main made the broker
        # Dockerfile hard-require this via `COPY --from=rune-crypto …` +
        # -DRUNE_CRYPTO_ROOT=/rune-crypto; without this named context the broker
        # image build fails with "COPY --from=rune-crypto: context not found".
        rune-crypto: ../../crypto
    image: rune-broker-node:${RUNE_IMAGE_TAG:-single}
    platform: linux/amd64
    hostname: rune-1
    # DR-BUG-RESTART-BIND: these fixed ports lie inside Linux's ephemeral range (32768-60999); reserved (a
    # per-netns sysctl) so no socket auto-bound first - e.g. the broker's own Aeron publications while it
    # starts - can take one and fail a (re)start with 'Address already in use' (the broker WARNs otherwise).
    sysctls:
      net.ipv4.ip_local_reserved_ports: "40111,40200,40222"
    shm_size: "256m"
    security_opt:
      - seccomp=unconfined
    environment:
      # Single-node cluster: RUNE_PEERS lists ONLY this node → self-elect.
      # Format: id@host:consensusPort:clientPort:replicationPort.
      RUNE_PEERS: "0@rune-1:40111:40200:40222"
      RUNE_NODE_ID: "0"
      RUNE_DATA_DIR: /var/lib/rune
      # dev: auto-format empty volumes (the dr-e2e harness and docker/*e2e.sh rely on it)
      RUNE_STORAGE_FORMAT: "${RUNE_STORAGE_FORMAT:-auto}"
      RUNE_CLIENT_ENDPOINT: "0.0.0.0:40200"
      RUNE_ELECTION_TIMEOUT_MS: "300"
      RUNE_ELECTION_STATUS_INTERVAL_MS: "50"
      RUNE_STARTUP_CANVASS_TIMEOUT_MS: "200"
      RUNE_LOG_LEVEL: "info"
      # Explicit off; "0" (= unset) is also the default — RUNE_FS_LOG is opt-in.
      RUNE_FS_LOG: "0"
      # Container /dev/shm budget (2026-10-02 defaults): the broker DEFAULT term is
      # 16 MiB and every publication/image maps 3 terms (48 MiB) — on the RECEIVING
      # side too, so a DR client container (--shm-size=64m) could not hold one broker
      # image.  Explicit 4 MiB terms (the pre-2026-10-02 size) for the containers.
      RUNE_AERON_TERM_BUFFER_BYTES: "4194304"
      # NOTE: no topics are declared here — the typed topic "characters" is created at
      # RUNTIME by the probe via defineTopic() (the whole point of Task 13).
      # io_uring portability under Rosetta amd64 emulation (see docker-compose.yml).
      RUNE_IO_BACKEND: "portable"
      # Authentication stays ON for a single node (RUNE_AUTH=disabled is the explicit dev-only opt-out).
      RUNE_CLUSTER_KEY_FILE: /run/secrets/cluster.key
      # Issue #10: every client session of an authenticating broker is TLS - the broker certificate (and key)
      # sit next to the cluster key (docker/lib/auth.sh rune_gen_cluster_key writes all three).
      RUNE_TLS_CERT_FILE: /run/secrets/tls.pem
      RUNE_TLS_KEY_FILE: /run/secrets/tls.key
    volumes:
      - rune-data-1:/var/lib/rune
      - type: bind
        source: ${RUNE_SECRETS_DIR:-./secrets}/cluster.key
        target: /run/secrets/cluster.key
        read_only: true
        bind:
          create_host_path: false   # a missing key file fails the start; never a directory
      - type: bind
        source: ${RUNE_SECRETS_DIR:-./secrets}/tls.pem
        target: /run/secrets/tls.pem
        read_only: true
        bind:
          create_host_path: false   # issue #10: a missing TLS file fails the start
      - type: bind
        source: ${RUNE_SECRETS_DIR:-./secrets}/tls.key
        target: /run/secrets/tls.key
        read_only: true
        bind:
          create_host_path: false   # issue #10: a missing TLS file fails the start
    healthcheck:
      test: ["CMD", "pgrep", "-x", "rune_broker"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  rune-data-1:
