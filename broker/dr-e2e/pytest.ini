[pytest]
# Hard per-test timeout (pytest-timeout) — no test may hang the suite. Fault
# tests can override per-test with @pytest.mark.timeout(N).
timeout = 600
timeout_method = thread
addopts = -ra
testpaths = tests
markers =
    baseline: DR-1 baseline matrix (produce/subscribe, no faults)
    fault: destructive fault-injection scenario (needs fresh_cluster)
    netem: requires the netem sidecar + NET_ADMIN
