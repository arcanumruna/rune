<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Rune: about 50 microseconds p50 and about 200 microseconds p99 produce to ack; reliable UDP transport, never TCP; zero allocations on the hot path">
  <defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11111b"/><stop offset="1" stop-color="#06060a"/></linearGradient>
  <linearGradient id="num" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect x=".5" y=".5" width="1199" height="189" rx="22" fill="url(#card)" stroke="#a885f7" stroke-opacity=".25"/>
  <text x="34" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="40" font-weight="500" letter-spacing="-1" fill="url(#num)">≈ 50 µs</text>
  <text x="34" y="122" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#edecf5">p50 produce → ack</text>
  <text x="34" y="150" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#7a7a92">headline figure</text>
  <line x1="300" y1="1" x2="300" y2="189" stroke="#ffffff" stroke-opacity=".07"/>
  <text x="334" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="40" font-weight="500" letter-spacing="-1" fill="url(#num)">≈ 200 µs</text>
  <text x="334" y="122" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#edecf5">p99 produce → ack</text>
  <text x="334" y="150" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#7a7a92">headline figure</text>
  <line x1="600" y1="1" x2="600" y2="189" stroke="#ffffff" stroke-opacity=".07"/>
  <text x="634" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="40" font-weight="500" letter-spacing="-1" fill="url(#num)">rUDP</text>
  <text x="634" y="122" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#edecf5">reliable UDP transport</text>
  <text x="634" y="150" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#7a7a92">never TCP · embedded Aeron driver</text>
  <line x1="900" y1="1" x2="900" y2="189" stroke="#ffffff" stroke-opacity=".07"/>
  <text x="934" y="84" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="40" font-weight="500" letter-spacing="-1" fill="url(#num)">0</text>
  <text x="934" y="122" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#edecf5">allocations on the hot path</text>
  <text x="934" y="150" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#7a7a92">produce · consume · query</text>
</svg>
