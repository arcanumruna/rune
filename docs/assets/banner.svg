<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Rune: a durable log that is also your database. Part of Arcanum Realms.">
  <defs>
    <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="auraV" cx="0.82" cy="-0.05" r="0.6"><stop offset="0" stop-color="#a855f7" stop-opacity=".28"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="auraC" cx="0.06" cy="0.2" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feColorMatrix in="b" type="matrix" values="0 0 0 0 0.66  0 0 0 0 0.33  0 0 0 0 0.97  0 0 0 .55 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#06060a"/>
  <rect width="1200" height="420" rx="28" fill="url(#dots)"/>
  <rect width="1200" height="420" rx="28" fill="url(#auraV)"/>
  <rect width="1200" height="420" rx="28" fill="url(#auraC)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="27.5" fill="none" stroke="#a885f7" stroke-opacity=".22"/>

  <g transform="translate(540 52) scale(1.2)" filter="url(#glow)">
    <g fill="none" stroke="url(#rg)" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="3.5" d="M50 8 L86 29 L86 71 L50 92 L14 71 L14 29 Z"/>
      <path stroke-width="5.5" d="M42 34 V66"/>
      <path stroke-width="5.5" d="M42 34 L59 42 L42 50"/>
      <path stroke-width="5.5" d="M42 50 L58 66"/>
    </g>
  </g>

  <text x="600" y="232" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="600" letter-spacing="14" fill="url(#title)">RUNE</text>
  <text x="600" y="282" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#a3a3b8">A durable log that is also your database, built for game backends.</text>
  <text x="600" y="352" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="5" fill="#7a7a92">C++23 · AERON rUDP · TLS 1.3 · SCRAM-SHA-512</text>
  <text x="600" y="384" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="4" fill="#a855f7" fill-opacity=".85">PART OF ARCANUM REALMS</text>
</svg>
