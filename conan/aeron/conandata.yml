# Aeron 1.51.0 + upstream 2f9e9e49f1 (aeron-io/aeron#2226): the C++ wrapper's unavailable-image callback dropped the
# image's list reference, so the conductor freed images a poll was still iterating. rune.2 adds __atomic x86-64 atomics,
# the AERON_DRIVER_COMMAND_QUEUE_CAPACITY env var (tests run with 1m) and a fix for concurrent driver inits writing the
# shared default UDP bindings; rune.3 adds upstream c636a786c6 (aeron-io/aeron#2043: acquire reads of the client conductor's
# registration_status, TSan races in every async add). Drop this recipe for the first upstream release that carries all of them.
