# Builds the Rune image (broker + `rune` CLI) and publishes it to Docker Hub and GitHub Container Registry when a
# broker release tag (broker-vX.Y.Z, made by broker/release.sh) is pushed, then syncs the Docker Hub page
# (broker/docker/DOCKERHUB.md). Release tags are the only trigger.
#
# Repository settings it needs:
#   secrets.DOCKERHUB_USERNAME, secrets.DOCKERHUB_TOKEN  a Docker Hub user and a personal access token (Read, Write, Delete: the page sync needs Delete)
#   vars.DOCKERHUB_NAMESPACE                            the Docker Hub namespace (default: the GitHub owner)
name: broker-image

on:
  push:
    tags: ['broker-v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: broker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/rune
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/rune

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # flight-recorder is its own repo: check out the commit the broker pins (FLIGHT_RECORDER_GIT_TAG), never its
      # default-branch HEAD, which may need a newer aeron than the one the image builds against. The image also
      # compiles the client, so the client's pin must be the same commit. arcanum-metrics (header-only) is read at
      # the pin in broker/cmake/ArcanumMetrics.cmake.
      - name: Read the sibling pins
        id: pin
        run: |
          FR=$(sed -nE 's/^set\(FLIGHT_RECORDER_GIT_TAG "([0-9a-f]{40})".*/\1/p' broker/CMakeLists.txt)
          FR_CLIENT=$(sed -nE 's/^set\(FLIGHT_RECORDER_GIT_TAG "([0-9a-f]{40})".*/\1/p' client-cpp/CMakeLists.txt)
          AM=$(sed -nE 's/^set\(ARCANUM_METRICS_GIT_TAG "([0-9a-f]{40})".*/\1/p' broker/cmake/ArcanumMetrics.cmake)
          if [[ -z $FR || -z $AM ]]; then
            echo "::error::FLIGHT_RECORDER_GIT_TAG or ARCANUM_METRICS_GIT_TAG pin not found"
            exit 1
          fi
          if [[ $FR != "$FR_CLIENT" ]]; then
            echo "::error::flight-recorder pins differ: broker $FR, client-cpp ${FR_CLIENT:-<none>}"
            exit 1
          fi
          echo "fr=$FR" >> "$GITHUB_OUTPUT"
          echo "am=$AM" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/flight-recorder
          ref: ${{ steps.pin.outputs.fr }}
          path: flight-recorder

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arcanum-metrics
          ref: ${{ steps.pin.outputs.am }}
          path: arcanum-metrics

      - name: Check tag matches VERSION.txt
        run: |
          VERSION=$(< broker/VERSION.txt)
          if [[ ${GITHUB_REF_NAME#broker-v} != "$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match broker/VERSION.txt ($VERSION)"
            exit 1
          fi

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z $DOCKERHUB_USERNAME || -z $DOCKERHUB_TOKEN ]]; then
            echo "::error::set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish a release"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE_NAME: ${{ env.GHCR_IMAGE }}
          FLIGHT_RECORDER_DIR: ${{ github.workspace }}/flight-recorder
          ARCANUM_METRICS_DIR: ${{ github.workspace }}/arcanum-metrics
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          VERSION=$(< broker/VERSION.txt)
          broker/build_docker.sh --platform linux/amd64 \
            --cache-from type=gha,scope=broker --cache-to type=gha,scope=broker,mode=max \
            --tag "$GHCR_IMAGE:latest" \
            --tag "docker.io/$DOCKERHUB_REPO:$VERSION" --tag "docker.io/$DOCKERHUB_REPO:latest" \
            --push

  dockerhub-page:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          short-description: Rune, an ultra-low-latency durable log and database for MMORPG backends
          readme-filepath: broker/docker/DOCKERHUB.md
          enable-url-completion: true
