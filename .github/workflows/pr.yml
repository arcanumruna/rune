# Pull request CI (#706): every PR builds and runs the *Regression* suite; latency gates never run in CI (they need an
# idle host). The steps are the ones of sanitizers.yml without sanitizer flags: plain Debug.
# Conan installs dependencies here and exports the in-repo recipe (conan export conan/aeron, as sanitizers.yml does);
# it never creates or uploads a package.
#
# Cost (docs/testing.md, "CI"):
#   * client           the standalone client: every example compiles, the client *Regression* suite runs.
#   * broker-ratchets  the broker's Python source guards; no build.
#   * broker           the root tree + the broker *Regression* suite in 6 shards. A PR runs ONE shard (its number
#                      modulo 6, so the shards rotate across PRs and fit about one runner-hour); every push to main, the
#                      nightly run, a manual run and a PR labelled `ci:full` run all 6.
# The `labeled` event matters only for `ci:full`: any other label neither runs a job nor cancels the run in progress.
# Making these checks required is a branch-protection setting, not part of this file.
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && '-label' || '' }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: 'true'

jobs:
  # The broker shards to run: one for a plain PR, all six otherwise.
  plan:
    name: plan
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - id: shards
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [[ $EVENT == pull_request && $FULL != true ]]; then
            echo "shards=[$((PR % 6))]" >> "$GITHUB_OUTPUT"
          else
            echo 'shards=[0,1,2,3,4,5]' >> "$GITHUB_OUTPUT"
          fi

  client:
    name: client (Debug)
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The client compiles the flight recorder from a sibling checkout at its pin.
      - name: Read the sibling pin
        id: pin
        run: |
          FR=$(sed -nE 's/^set\(FLIGHT_RECORDER_GIT_TAG "([0-9a-f]{40})".*/\1/p' client-cpp/CMakeLists.txt)
          if [[ -z $FR ]]; then
            echo "::error::FLIGHT_RECORDER_GIT_TAG pin not found"
            exit 1
          fi
          echo "fr=$FR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/flight-recorder
          ref: ${{ steps.pin.outputs.fr }}
          path: flight-recorder

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache uuid-dev zlib1g-dev
          python3 -m pip install --user "conan>=2,<3" "cmake>=3.31"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Restore and save are separate steps so a failed or cancelled job still saves what it built.
      - uses: actions/cache/restore@v5
        id: conan_cache
        with:
          path: ~/.conan2/p
          key: conan-pr-client-${{ runner.os }}-${{ hashFiles('client-cpp/conandata.yml') }}
          restore-keys: |
            conan-pr-client-${{ runner.os }}-

      - uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-pr-client-${{ github.sha }}
          restore-keys: ccache-pr-client-

      - name: Install dependencies
        run: |
          conan profile detect --force
          conan export conan/aeron --version=1.51.0-rune.3
          conan install client-cpp -of build-client -s build_type=Debug --build=missing

      - uses: actions/cache/save@v5
        if: ${{ always() && steps.conan_cache.outputs.cache-matched-key != format('conan-pr-client-{0}-{1}', runner.os, hashFiles('client-cpp/conandata.yml')) }}
        with:
          path: ~/.conan2/p
          key: conan-pr-client-${{ runner.os }}-${{ hashFiles('client-cpp/conandata.yml') }}

      - name: Configure
        run: |
          # the client's conan layout puts its generators under a build/<type>/generators subfolder
          CLIENT_GEN=$(realpath "$(dirname "$(find "$GITHUB_WORKSPACE/build-client" -name conan_toolchain.cmake | head -1)")")
          cmake -S client-cpp -B build-client/cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$CLIENT_GEN/conan_toolchain.cmake" -DCMAKE_PREFIX_PATH="$CLIENT_GEN" \
            -DBUILD_TESTING=ON -DBUILD_EXAMPLES=ON \
            -DFLIGHT_RECORDER_DIR="$GITHUB_WORKSPACE/flight-recorder" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Builds every example too (BUILD_EXAMPLES=ON): an example that stops compiling fails the PR.
      - name: Build client
        run: cmake --build build-client/cmake

      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - uses: actions/cache/save@v5
        if: ${{ always() }}
        with:
          path: .ccache
          key: ccache-pr-client-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Latency gates never run in CI (-LE latency); UdpGsoBindings.Ipv6RoundTrip is a known flake (#628).
      # The client's source ratchets (NoAtomicsOrMutexes..., NoSharedOwnership..., NoFutures..., NoNewSyncOrSleeps...)
      # and the PR-workflow guard are *Regression* ctests, so they run here.
      - name: Regression suite (client)
        run: |
          ctest --test-dir build-client/cmake -R Regression -LE latency -E 'UdpGsoBindings\.Ipv6RoundTrip' -j4 \
            --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-client-logs
          path: build-client/cmake/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  # The broker's Python source guards (broker/CMakeLists.txt): no build, the same commands the ctests run.
  broker-ratchets:
    name: broker ratchets
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Single driver pumper guard
        run: |
          python3 broker/scripts/check_single_driver_pumper.py --selftest
          python3 broker/scripts/check_single_driver_pumper.py broker
      - name: No atomics or mutexes guard
        run: |
          python3 broker/scripts/check_no_atomics.py --selftest
          python3 broker/scripts/check_no_atomics.py broker
      - name: No retired topics env var
        run: |
          python3 broker/scripts/check_no_rune_topics.py broker
          python3 broker/scripts/test_check_no_rune_topics.py
      - name: Bench launchers are auth compatible
        run: bash broker/bench/kafka-compare/check-auth-config.sh

  broker:
    name: broker ${{ matrix.shard }}/6
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The broker compiles the flight recorder from a sibling checkout at the client's pin, and reads arcanum-metrics
      # (header-only) at the pin in broker/cmake/ArcanumMetrics.cmake.
      - name: Read the sibling pins
        id: pin
        run: |
          FR=$(sed -nE 's/^set\(FLIGHT_RECORDER_GIT_TAG "([0-9a-f]{40})".*/\1/p' client-cpp/CMakeLists.txt)
          AM=$(sed -nE 's/^set\(ARCANUM_METRICS_GIT_TAG "([0-9a-f]{40})".*/\1/p' broker/cmake/ArcanumMetrics.cmake)
          if [[ -z $FR || -z $AM ]]; then
            echo "::error::FLIGHT_RECORDER_GIT_TAG or ARCANUM_METRICS_GIT_TAG pin not found"
            exit 1
          fi
          echo "fr=$FR" >> "$GITHUB_OUTPUT"
          echo "am=$AM" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/flight-recorder
          ref: ${{ steps.pin.outputs.fr }}
          path: flight-recorder

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/arcanum-metrics
          ref: ${{ steps.pin.outputs.am }}
          path: arcanum-metrics

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache uuid-dev zlib1g-dev
          python3 -m pip install --user "conan>=2,<3" "cmake>=3.31"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@v5
        id: conan_cache
        with:
          path: ~/.conan2/p
          key: conan-pr-broker-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'client-cpp/conandata.yml') }}
          restore-keys: |
            conan-pr-broker-${{ runner.os }}-

      - uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-pr-broker-${{ github.sha }}
          restore-keys: ccache-pr-broker-

      - name: Install dependencies
        run: |
          conan profile detect --force
          conan export conan/aeron --version=1.51.0-rune.3
          conan install . -of build-broker -s build_type=Debug --build=missing

      - uses: actions/cache/save@v5
        if: ${{ always() && steps.conan_cache.outputs.cache-matched-key != format('conan-pr-broker-{0}-{1}', runner.os, hashFiles('conanfile.txt', 'client-cpp/conandata.yml')) }}
        with:
          path: ~/.conan2/p
          key: conan-pr-broker-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'client-cpp/conandata.yml') }}

      - name: Configure
        run: |
          cmake -S . -B build-broker -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/build-broker/conan_toolchain.cmake" -DBUILD_TESTING=ON \
            -DFLIGHT_RECORDER_DIR="$GITHUB_WORKSPACE/flight-recorder" \
            -DARCANUM_METRICS_DIR="$GITHUB_WORKSPACE/arcanum-metrics" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build broker
        run: cmake --build build-broker

      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - uses: actions/cache/save@v5
        if: ${{ always() && matrix.shard == 0 }}
        with:
          path: .ccache
          key: ccache-pr-broker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Shard k takes every 6th test number from k+1 on (ctest -I), as in sanitizers.yml, so the heavy cluster suites
      # spread evenly. Latency and stress tests never run here.
      - name: Regression suite (broker)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          total=$(ctest --test-dir build-broker -N | sed -nE 's/^Total Tests: ([0-9]+)/\1/p')
          ctest --test-dir build-broker -R Regression -LE "latency|stress" -E 'UdpGsoBindings\.Ipv6RoundTrip' \
            -I "$((SHARD+1)),$total,6" -j2 --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-broker-logs-${{ matrix.shard }}
          path: build-broker/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14
